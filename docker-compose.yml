services:
  redis:
    image: redis:7-alpine
    container_name: syncdraft_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: syncdraft_postgres
    environment:
      POSTGRES_USER: syncdraft
      POSTGRES_PASSWORD: syncdraft
      POSTGRES_DB: syncdraft
    ports:
      - "5432:5432"
    volumes:
      - syncdraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncdraft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  syncdraft_pgdata:
